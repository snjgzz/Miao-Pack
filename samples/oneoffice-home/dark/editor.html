<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>编辑壳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#141614;color:#F2F4F2;min-height:100vh;display:flex}
aside{width:220px;background:#191B19;border-right:1px solid rgba(255,255,255,0.08);padding:18px 12px;flex:none}
.brand{font-weight:650;font-size:13px;margin-bottom:14px}
.brand span{display:block;color:#8E988E;font-weight:500;font-size:11px;margin-top:3px}
.g{font-size:11px;color:#8E988E;padding:10px 8px 4px}
a{display:block;padding:6px 8px;border-radius:6px;color:#F2F4F2;text-decoration:none;font-size:13px}
a.on{background:color-mix(in srgb,#0D9488 18%, transparent);color:#0D9488;font-weight:600}
main{flex:1;padding:28px 32px;min-width:0}
h1{font-size:22px;letter-spacing:-.03em}
p.lead{color:#8E988E;margin:8px 0 18px;line-height:1.5;max-width:560px}
.card{background:#1C1E1C;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:16px;max-width:640px}
.bar{height:8px;border-radius:4px;background:#0D9488;width:34%;opacity:.8;margin-bottom:12px}
.row{height:8px;border-radius:4px;background:rgba(255,255,255,0.08);margin-top:8px}
button,a.btn{display:inline-flex;margin-top:16px;background:#0D9488;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-weight:600;text-decoration:none}
footer{margin-top:22px;color:#8E988E;font-size:12px}
.stage{position:relative;min-height:420px;background:#1C1E1C;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.dlg{width:320px;background:#1C1E1C;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.16)}
</style>
</head>
<body>
<aside>
  <div class="brand">OneOffice 首页<span>dark · HTML</span></div>
  <div class="g">首页</div><a class="" href="home.html">首页</a><div class="g">工作区</div><a class="on" href="editor.html">编辑壳</a><div class="g">设置</div><a class="" href="settings.html">设置</a>
</aside>
<main>
  <h1>编辑壳</h1><p class="lead">文档编辑壳：顶栏与画布。</p>
<div class="card"><div class="bar"></div><div class="row" style="width:80%"></div><div class="row" style="width:62%"></div>
<a class="btn" href="settings.html">打开下一页</a></div>
  <footer>生成于 2026-10-16 09:56:18 UTC · 仅 HTML，无 PNG</footer>
</main>
</body>
</html>
